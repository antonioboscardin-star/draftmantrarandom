const ROLE={P:'Portieri',D:'Difensori',C:'Centrocampisti',A:'Attaccanti'};
const FASCIA={T:'Top',S:'Semi-Top','3':'Terza','4':'Quarta',SC:'Scommesse',O:'Outsider'};
const LV_OPTS=[['','Tutti'],['Alta','Alta'],['AM','Alta o Media'],['Media','Media'],['Bassa','Bassa'],['nd','n.d.']];
const SHORT={rm:'Mantra',bu:'Bud %',pp:'PMA %',ti:'Titol.',af:'Affid.',ig:'Integr.',n:'Giocatore'};
const STAT=new Set(['pz','bu','pma','pp','fm','ti','af','ig']);
const lab=k=>SHORT[k]||COLS.find(c=>c[0]===k)[1];
const COLS=[
 ['r','Ruolo','c',p=>`<span class="role">${p.r}</span>`,(a,b)=>'PDCA'.indexOf(a.r)-'PDCA'.indexOf(b.r)],
 ['rm','R. Mantra','c',p=>`<span class="rm">${esc(p.rm)}</span>`,(a,b)=>a.rm.localeCompare(b.rm)],
 ['f','Fascia','c',p=>`<span class="fascia ${p.f}">${FASCIA[p.f]}</span>`,(a,b)=>Object.keys(FASCIA).indexOf(a.f)-Object.keys(FASCIA).indexOf(b.f)],
 ['n','Giocatore','l',p=>esc(p.n),(a,b)=>a.n.localeCompare(b.n,'it')],
 ['t','Squadra','l',p=>esc(p.t),(a,b)=>a.t.localeCompare(b.t,'it')],
 ['pz','Prezzo','c',p=>p.pz,num('pz')],
 ['bu','Budget %','c',p=>pct(p.bu),num('bu')],
 ['pma','PMA','c',p=>p.pma??'-',num('pma')],
 ['pp','PMA %','c',p=>pct(p.pp),num('pp')],
 ['fm','FM Exp','c',p=>p.fm.toFixed(2),num('fm')],
 ['ti','Titolarità','c',p=>lv(p.ti),lvs('ti')],
 ['af','Affidabilità','c',p=>lv(p.af),lvs('af')],
 ['ig','Integrità','c',p=>lv(p.ig),lvs('ig')],
];
function num(k){return (a,b)=>(a[k]??-1)-(b[k]??-1)}
function lvs(k){const o={Alta:3,Media:2,Bassa:1};return (a,b)=>(o[a[k]]||0)-(o[b[k]]||0)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function pct(v){return v==null?'-':(v*100).toFixed(1)+'%'}
function lv(v){return v?`<span class="lv ${v}">${v}</span>`:'<span class="lv nd">n.d.</span>'}
const $=id=>document.getElementById(id);
const S={bought:new Set(),sort:null,dir:1,view:'av',roles:new Set(),fasce:new Set(),rms:new Set(),cmp:[],cmpOpen:false};
let ref=null,lastBought=null;

/* ---- persistenza: localStorage + db (privato per utente) ---- */
const LS='listone-fasce-comprati';
function loadLocal(){try{const a=JSON.parse(localStorage.getItem(LS)||'[]');if(Array.isArray(a))a.forEach(x=>S.bought.add(x))}catch(e){}}
function save(){
  const ids=[...S.bought];
  try{localStorage.setItem(LS,JSON.stringify(ids))}catch(e){}
  if(ref){ref.set({ids}).then(()=>setSave('Salvato')).catch(()=>setSave('Salvato solo su questo browser'))}
  else setSave('Salvato su questo browser');
}
function setSave(t){$('save').textContent='· '+t}
async function initDb(){
  try{
    if(!window.claude||!claude.use)return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const uid=await user.id(); if(!uid)return;
    ref=db.collection('data/users/'+uid).doc('bought');
    let first=true;
    ref.onSnapshot(s=>{
      const remote=s.exists?(s.data().ids||[]):null;
      if(remote===null){ if(first&&S.bought.size)save(); first=false; return}
      first=false;
      const a=[...S.bought].sort().join('|'),b=[...remote].sort().join('|');
      if(a!==b){S.bought=new Set(remote);try{localStorage.setItem(LS,JSON.stringify(remote))}catch(e){};render()}
      setSave('Sincronizzato');
    },()=>setSave('Salvato su questo browser'));
  }catch(e){}
}

/* ---- filtri ---- */
function fill(sel,opts){sel.innerHTML=opts.map(([v,t])=>`<option value="${esc(v)}">${esc(t)}</option>`).join('')}
function init(){
  loadLocal();
  const teams=[...new Set(P.map(p=>p.t))].sort((a,b)=>a.localeCompare(b,'it'));
  fill($('team'),[['','Tutte']].concat(teams.map(t=>[t,t])));
  ['ti','af','ig'].forEach(k=>fill($(k),LV_OPTS));
  $('roles').innerHTML=Object.entries(ROLE).map(([k,v])=>`<button class="chip" data-k="${k}" aria-pressed="false">${v}</button>`).join('');
  $('fasce').innerHTML=Object.entries(FASCIA).map(([k,v])=>`<button class="chip fx" data-k="${k}" aria-pressed="false" style="--c:var(--x)">${v}</button>`).join('');
  $('rms').innerHTML=['Por','Dd','Ds','Dc','B','E','M','C','W','T','A','Pc'].map(k=>`<button class="chip" data-k="${k}" aria-pressed="false">${k}</button>`).join('');
  document.querySelectorAll('#rms .chip').forEach(b=>b.onclick=()=>toggle(S.rms,b));
  document.querySelectorAll('#roles .chip').forEach(b=>b.onclick=()=>toggle(S.roles,b));
  document.querySelectorAll('#fasce .chip').forEach(b=>{b.onclick=()=>toggle(S.fasce,b)});
  ['q','team','pzMin','pzMax','pmaMin','pmaMax','fmMin','ti','af','ig'].forEach(id=>$(id).addEventListener('input',render));
  fill($('sortSel'),[['','Ordine listino']].concat(COLS.map((c,i)=>[String(i),lab(c[0])])));
  $('sortSel').onchange=()=>{S.sort=$('sortSel').value===''?null:+$('sortSel').value;S.dir=1;render()};
  $('sortDir').onclick=()=>{S.dir=-S.dir;render()};
  $('reset').onclick=resetF;$('sheetReset').onclick=resetF;
  $('mroles').innerHTML=Object.entries({P:'Por',D:'Dif',C:'Cen',A:'Att'}).map(([k,v])=>`<button class="chip" data-k="${k}" aria-pressed="false">${v}</button>`).join('');
  document.querySelectorAll('#mroles .chip').forEach(b=>b.onclick=()=>document.querySelector(`#roles .chip[data-k="${b.dataset.k}"]`).click());
  $('mSearch').oninput=()=>{$('q').value=$('mSearch').value;render()};
  const sheet=o=>{document.body.classList.toggle('sheet',o);$('backdrop').hidden=!o};
  $('filtBtn').onclick=()=>sheet(true);$('sheetClose').onclick=$('sheetDone').onclick=$('backdrop').onclick=()=>sheet(false);
  let open=true;try{open=localStorage.getItem('listone-filtri-aperti')!=='0'}catch(e){}
  const setOpen=o=>{open=o;$('moreF').hidden=!o;$('moreBtn').setAttribute('aria-expanded',o);$('moreArr').textContent=o?'▴':'▾';try{localStorage.setItem('listone-filtri-aperti',o?'1':'0')}catch(e){}};
  setOpen(open);$('moreBtn').onclick=()=>setOpen(!open);
  $('tabAv').onclick=()=>setView('av'); $('tabBo').onclick=()=>setView('bo');
  $('toastUndo').onclick=undo;
  $('cmpGo').onclick=()=>{S.cmpOpen=true;renderCmp();$('cmp').scrollIntoView({behavior:'smooth',block:'start'})};
  $('cmpClear').onclick=()=>{S.cmp=[];S.cmpOpen=false;render()};
  $('cmp').onclick=e=>{const b=e.target.closest('[data-rm]');if(b){S.cmp=S.cmp.filter(x=>x!==b.dataset.rm);if(S.cmp.length<2)S.cmpOpen=false;render()}if(e.target.closest('#cmpClose')){S.cmpOpen=false;renderCmp()}};
  const th=$('tbl').tHead.insertRow();
  const c0=document.createElement('th');c0.textContent='Conf.';c0.style.cursor='default';th.appendChild(c0);
  COLS.forEach(([k,t,cls],i)=>{const c=document.createElement('th');c.textContent=lab(k);c.className=cls.startsWith('l')?'l':'';c.onclick=()=>{S.dir=S.sort===i?-S.dir:1;S.sort=i;render()};th.appendChild(c)});
  const a=document.createElement('th');a.textContent='Azione';a.style.cursor='default';th.appendChild(a);
  $('tbl').tBodies[0].onchange=e=>{const c=e.target.closest('input[data-cmp]');if(!c)return;const id=c.dataset.cmp;
    if(c.checked){if(S.cmp.length>=8){c.checked=false;return}S.cmp.push(id)}else S.cmp=S.cmp.filter(x=>x!==id);
    if(S.cmp.length<2)S.cmpOpen=false;renderCmp()};
  $('tbl').tBodies[0].onclick=e=>{const b=e.target.closest('button[data-id]');if(b)toggleBought(b.dataset.id)};
  render(); initDb();
}
function toggle(set,b){const k=b.dataset.k;set.has(k)?set.delete(k):set.add(k);b.setAttribute('aria-pressed',set.has(k));
  if(b.classList.contains('fx')){const v={T:'--top',S:'--semi','3':'--terza','4':'--quarta',SC:'--scomm',O:'--out'}[k];b.style.background=set.has(k)?`var(${v})`:''}
  render()}
function resetF(){$('mSearch').value='';S.rms.clear();S.roles.clear();S.fasce.clear();document.querySelectorAll('.chip').forEach(b=>{b.setAttribute('aria-pressed','false');b.style.background=''});
  ['q','pzMin','pzMax','pmaMin','pmaMax','fmMin'].forEach(i=>$(i).value='');['team','ti','af','ig'].forEach(i=>$(i).value='');render()}
function setView(v){S.view=v;$('tabAv').setAttribute('aria-selected',v==='av');$('tabBo').setAttribute('aria-selected',v==='bo');render()}
function lvOk(val,f){if(!f)return true;if(f==='nd')return !val;if(f==='AM')return val==='Alta'||val==='Media';return val===f}
function pass(p){
  const q=$('q').value.trim().toLowerCase(); if(q&&!p.n.toLowerCase().includes(q))return false;
  if($('team').value&&p.t!==$('team').value)return false;
  if(S.roles.size&&!S.roles.has(p.r))return false;
  if(S.fasce.size&&!S.fasce.has(p.f))return false;
  if(S.rms.size&&!p.rm.split('/').some(x=>S.rms.has(x)))return false;
  const n=id=>$(id).value===''?null:+$(id).value;
  const a=n('pzMin'),b=n('pzMax'),c=n('pmaMin'),d=n('pmaMax'),e=n('fmMin');
  if(a!=null&&p.pz<a)return false; if(b!=null&&p.pz>b)return false;
  if(c!=null&&(p.pma==null||p.pma<c))return false; if(d!=null&&(p.pma==null||p.pma>d))return false;
  if(e!=null&&p.fm<e)return false;
  return lvOk(p.ti,$('ti').value)&&lvOk(p.af,$('af').value)&&lvOk(p.ig,$('ig').value);
}
function toggleBought(id){
  const was=S.bought.has(id); was?S.bought.delete(id):S.bought.add(id);
  const p=P.find(x=>x.id===id); lastBought={id,was};
  save(); render();
  $('toastMsg').textContent=(was?'Rimesso in lista: ':'Comprato: ')+p.n; $('toast').hidden=false;
  clearTimeout(toggleBought.t); toggleBought.t=setTimeout(()=>$('toast').hidden=true,5000);
}
function undo(){if(!lastBought)return;lastBought.was?S.bought.add(lastBought.id):S.bought.delete(lastBought.id);lastBought=null;$('toast').hidden=true;save();render()}
function render(){
  const inView=P.filter(p=>(S.view==='bo')===S.bought.has(p.id));
  let rows=inView.filter(pass);
  if(S.sort!=null){const cmp=COLS[S.sort][4];rows=rows.slice().sort((a,b)=>cmp(a,b)*S.dir)}
  const spent=P.filter(p=>S.bought.has(p.id)).reduce((s,p)=>s+p.pz,0);
  $('sAv').textContent=P.length-S.bought.size; $('sBo').textContent=S.bought.size; $('sSp').textContent=spent;
  $('tabBo').textContent='Comprati ('+S.bought.size+')';
  const nAct=S.rms.size+S.fasce.size+['pzMin','pzMax','pmaMin','pmaMax','fmMin','ti','af','ig'].filter(i=>$(i).value!=='').length;
  document.querySelectorAll('#mroles .chip').forEach(b=>b.setAttribute('aria-pressed',S.roles.has(b.dataset.k)));
  const nAll=nAct+($('team').value?1:0);$('fN').innerHTML=nAll?`<span class="badge">${nAll}</span>`:'';$('sheetN').textContent=rows.length;
  $('moreN').innerHTML=nAct?`<span class="badge">${nAct}</span>`:'';
  $('sortSel').value=S.sort==null?'':String(S.sort);$('sortDir').textContent=S.dir>0?'▲':'▼';
  $('count').textContent=`${rows.length} giocatori mostrati su ${inView.length}`;
  [...$('tbl').tHead.rows[0].cells].forEach((c,i)=>{if(i===0)return;const j=i-1;const on=S.sort===j;c.classList.toggle('sorted',on);const t=COLS[j]?lab(COLS[j][0]):'Azione';c.textContent=t+(on?(S.dir>0?' ▲':' ▼'):'')});
  const body=$('tbl').tBodies[0];
  if(!rows.length){body.innerHTML=`<tr><td colspan="${COLS.length+2}" class="empty" style="width:100%">${S.view==='bo'?'Nessun giocatore comprato con questi filtri.':'Nessun giocatore corrisponde ai filtri.'}</td></tr>`;renderCmp();return}
  body.innerHTML=rows.map(p=>`<tr><td class="c0"><input type="checkbox" class="cb" data-cmp="${p.id}" aria-label="Confronta ${esc(p.n)}"${S.cmp.includes(p.id)?' checked':''}></td>`+COLS.map(([k,t,cls,f])=>`<td class="c-${k} ${cls.startsWith('l')?'l ':''}${k==='n'?'name ':''}${STAT.has(k)?'st':''}" data-label="${lab(k)}">${k==='n'?f(p)+'<span class="tm"> · '+esc(p.t)+'</span>':f(p)}</td>`).join('')+
   `<td class="c-act"><button class="buy${S.bought.has(p.id)?' undo':''}" data-id="${p.id}">${S.bought.has(p.id)?'Rimetti':'Comprato'}</button></td></tr>`).join('');
  renderCmp();
}
const LVO={Alta:3,Media:2,Bassa:1};
const CMPROWS=[
 ['Ruolo',p=>ROLE[p.r]],['Ruolo Mantra',p=>p.rm],['Squadra',p=>esc(p.t)],['Fascia',p=>FASCIA[p.f]],
 ['Prezzo',p=>p.pz,'min'],['Budget %',p=>pct(p.bu)],['PMA',p=>p.pma??'-'],['PMA %',p=>pct(p.pp)],
 ['FM Exp',p=>p.fm.toFixed(2),'max',p=>p.fm],
 ['Titolarità',p=>p.ti||'n.d.','max',p=>LVO[p.ti]||0],['Affidabilità',p=>p.af||'n.d.','max',p=>LVO[p.af]||0],['Integrità',p=>p.ig||'n.d.','max',p=>LVO[p.ig]||0],
 ['FM per credito',p=>(p.fm/p.pz).toFixed(2),'max',p=>p.fm/p.pz],
 ['Stato',p=>S.bought.has(p.id)?'Comprato':'Disponibile']
];
function renderCmp(){
  S.cmp=S.cmp.filter(id=>P.some(p=>p.id===id));
  const n=S.cmp.length;
  $('cmpbar').hidden=n===0; $('cmpN').textContent=n;
  $('cmpGo').disabled=n<2; $('cmpHint').textContent=n<2?'Selezionane almeno 2 (massimo 8).':'';
  const box=$('cmp'); box.hidden=!(S.cmpOpen&&n>=2); if(box.hidden)return;
  const pl=S.cmp.map(id=>P.find(p=>p.id===id));
  let h='<div class="cmphead"><h2>Confronto</h2><button class="btn" id="cmpClose">Chiudi</button></div><div class="cmpscroll"><table><thead><tr><th class="lab"></th>'+
    pl.map(p=>`<th><div>${esc(p.n)}</div><button class="rm2" data-rm="${p.id}" aria-label="Rimuovi ${esc(p.n)}">×</button></th>`).join('')+'</tr></thead><tbody>';
  CMPROWS.forEach(([lab,f,mode,key])=>{
    let best=null;
    if(mode){const vals=pl.map(p=>mode==='min'?p.pz:key(p));best=mode==='min'?Math.min(...vals):Math.max(...vals);
      if(vals.every(v=>v===vals[0]))best=null;
      h+=`<tr><td class="lab">${lab}</td>`+pl.map((p,i)=>`<td class="${best!==null&&vals[i]===best?'best':''}">${f(p)}</td>`).join('')+'</tr>';
    }else h+=`<tr><td class="lab">${lab}</td>`+pl.map(p=>`<td>${f(p)}</td>`).join('')+'</tr>';
  });
  h+='</tbody></table></div><div class="note">Evidenziato il valore migliore: prezzo più basso, FM Exp, livelli e FM per credito più alti. Il PMA non è evidenziato perché non misura la qualità.</div>';
  box.innerHTML=h;
}
init();
</script>

</body></html>
