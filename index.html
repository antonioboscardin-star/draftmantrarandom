<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asta Fantacalcio – Sorteggio prima chiamata</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-v="home">
<div class="wrap">
<h1>⚽ Asta Draft - Sorteggio ordine prima chiamata</h1>
<p class="sub" id="banner"></p>
<button class="btn" id="home" hidden>← Home</button>

<section id="vHome" class="panel">
  <div class="cards">
    <div class="card"><h2>Nuovo sorteggio</h2>
      <input id="newName" placeholder="Nome (es. Asta 2026/27)" maxlength="40" aria-label="Nome estrazione">
      <button class="btn go" id="create">Crea e gestisci</button></div>
    <div class="card"><h2>Guarda un sorteggio</h2><p>Segui in diretta un sorteggio già creato.</p>
      <button class="btn go" id="watch">Vedi estrazioni</button></div>
  </div>
  <div id="mine"></div>
</section>

<section id="vList" class="panel"><h2>Estrazioni</h2><div id="pickList"></div></section>

<div id="vDraw">
  <h2 id="curName"></h2>
  <section class="panel o" aria-labelledby="cfg">
    <h2 id="cfg">Formazione iniziale</h2>
    <div class="row"><span>Numero di squadre</span>
      <div class="stepper"><button id="minus" aria-label="Diminuisci">−</button><output id="n">10</output><button id="plus" aria-label="Aumenta">+</button></div>
      <span style="opacity:.8">da 6 a 14</span></div>
    <div class="teams" id="teams"></div>
  </section>
  <section class="panel stage" aria-label="Estrazione">
    <div class="slot"><small>Posizione estratta</small><div class="shirt" id="pos">?</div></div>
    <div class="slot"><small>Squadra assegnata</small><div class="name" id="team">?</div></div>
    <div class="actions" style="grid-column:1/-1">
      <button class="btn go o" id="draw">Estrai posizione</button>
      <button class="btn o" id="auto">Estrai tutto</button>
      <button class="btn" id="copy" disabled>Copia ordine finale</button>
      <button class="btn o" id="link">Copia link spettatori</button>
      <button class="btn red o" id="reset">Ricomincia</button>
      <button class="btn red o" id="del">Elimina estrazione</button>
    </div>
    <p class="msg" id="msg" style="grid-column:1/-1" role="status"></p>
  </section>
  <section class="panel" aria-labelledby="ord"><h2 id="ord">Ordine di chiamata</h2><ol id="list"></ol></section>
</div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
